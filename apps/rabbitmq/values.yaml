# RabbitMQ for backend and discord: the compose host's image. No egress at all
# beyond DNS; only backend, backend-worker and discord may connect (5.3).
components:
  rabbitmq:
    image:
      repository: public.ecr.aws/docker/library/rabbitmq
      tag: 4.4-management-alpine
      digest: sha256:b768d2e09a809b48458d6c3c32fc2894643a6bfafd76264c120373eff0ee6532
    # Node name rabbit@rabbitmq, so the data directory stays the same across restarts.
    hostname: rabbitmq
    # The image's rabbitmq user.
    user: 100
    group: 101
    ports:
      - {name: amqp, port: 5672}
      - {name: management, port: 15672}
    readOnlyRootFilesystem: false
    env:
      RABBITMQ_DEFAULT_USER: ypm
    secretEnv:
      keys:
        RABBITMQ_DEFAULT_PASS: generated/rabbitmq_password
    persistence: {size: 5Gi, mountPath: /var/lib/rabbitmq}
    probe: {tcp: 5672, startupSeconds: 120}
    priorityClassName: ypm-critical
    terminationGracePeriodSeconds: 60
    resources: {cpu: 25m, memory: 160Mi, memoryLimit: 768Mi}
