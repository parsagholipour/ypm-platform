image:
  repository: 780564622080.dkr.ecr.us-east-1.amazonaws.com/ypm/git-backup

components:
  # gickup: mirrors the GitHub repos every night at 22:00 UTC. The only
  # component holding the GitHub token.
  git-backup:
    command: ["sh", "-c", "umask 077 && envsubst '$GITHUB_TOKEN $GITHUB_USER' </gickup/conf.template.yml >/tmp/conf.yml && exec /gickup/gickup /tmp/conf.yml"]
    network: {internet: true}
    secretEnv:
      paths: [env/git_backup]
    writable: [/tmp]
    persistence: {size: 10Gi, mountPath: /data}
    resources: {cpu: 10m, memory: 64Mi, memoryLimit: 512Mi}

  # The dashboard (login + TOTP, users in /data/web/users.json), same volume.
  git-backup-web:
    ports: [{name: http, port: 3000}]
    network: {edge: true}
    env:
      NODE_ENV: production
      PORT: "3000"
      # CloudFront, then Caddy: req.ip is the viewer for the login IP block.
      TRUSTED_PROXY_HOPS: "2"
    secretEnv:
      paths: [env/git_backup_web]
    writable: [/tmp]
    persistence: {claim: git-backup-data, mountPath: /data}
    probe: {http: {path: /api/auth/status, port: 3000}, startupSeconds: 30}
    terminationGracePeriodSeconds: 10
    resources: {cpu: 10m, memory: 64Mi, memoryLimit: 256Mi}
