  labels:
    {{- include "service.labels" (dict "name" $name "root" $) | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: ssm
  target:
    name: {{ $name }}-env
    creationPolicy: Owner
  {{- with .keys }}
  data:
    {{- range $k, $path := . }}
    - secretKey: {{ $k }}
      remoteRef:
        key: {{ $.Values.parameterPrefix }}/{{ $path }}
    {{- end }}
  {{- end }}
  {{- with .paths }}
  dataFrom:
    {{- range . }}
    - find:
        path: {{ $.Values.parameterPrefix }}/{{ . }}
        name:
          regexp: ".+"
      rewrite:
        - regexp:
            source: "^{{ $.Values.parameterPrefix }}/{{ . }}/(.+)$"
            target: "$1"
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
