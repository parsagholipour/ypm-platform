{{- range $name, $c := .Values.components }}
{{- with $c.secretEnv }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-env
  labels:
    {{- include "service.labels" (dict "name" $name "root" $) | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: ssm
  target:
    name: {{ $name }}-env
    creationPolicy: Owner
    {{- with .templates }}
    template:
      engineVersion: v2
      # Keep every fetched key and add the templated ones.
      mergePolicy: Merge
      data:
        {{- range $k, $v := . }}
        {{ $k }}: {{ include "service.subst" (dict "root" $ "value" $v) | quote }}
        {{- end }}
    {{- end }}
  {{- with .keys }}
  data:
    {{- range $k, $path := . }}
    - secretKey: {{ $k }}
      remoteRef:
        key: {{ $.Values.parameterPrefix }}/{{ $path }}
    {{- end }}
  {{- end }}
  {{- with .paths }}
  dataFrom:
    {{- range . }}
    - find:
        path: {{ $.Values.parameterPrefix }}/{{ . }}
        name:
          regexp: ".+"
      rewrite:
        # /ypm/prod/env/<service>/KEY -> KEY
        - regexp:
            source: "^{{ $.Values.parameterPrefix }}/{{ . }}/(.+)$"
            target: "$1"
    {{- end }}
  {{- end }}
{{- end }}
{{- with $c.secretFiles }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-files
  labels:
    {{- include "service.labels" (dict "name" $name "root" $) | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: ssm
  target:
    name: {{ $name }}-files
    creationPolicy: Owner
  data:
    {{- range . }}
    - secretKey: {{ base .path }}
      remoteRef:
        key: {{ $.Values.parameterPrefix }}/{{ .parameter }}
    {{- end }}
{{- end }}
{{- end }}
{{- range $name, $j := .Values.cronJobs }}
{{- with $j.secretEnv }}
---
