apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: rabbitmq}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [backend, backend-worker, discord]}
      ports:
        - {protocol: TCP, port: 5672}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-clients
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [backend, backend-worker, discord]}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: rabbitmq}
      ports:
        - {protocol: TCP, port: 5672}
---
# The backend also pushes its application logs to Loki (LOKI_HOST).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-to-loki
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [backend, backend-worker]}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
          podSelector:
            matchLabels: {app.kubernetes.io/name: loki}
      ports:
        - {protocol: TCP, port: 3100}
