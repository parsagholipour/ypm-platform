apiVersion: v1
kind: ServiceAccount
metadata:
  name: ssm-reader
  namespace: ypm
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::780564622080:role/ypm-prod-k3s-secrets-ypm
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ssm
  namespace: ypm
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: ssm-reader
