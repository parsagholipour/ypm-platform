apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-repo-creds
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: ssm}
  target:
    name: github-repo-creds
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: git
        url: https://github.com/parsagholipour
        githubAppID: "{{ .appID }}"
        githubAppInstallationID: "{{ .installationID }}"
        githubAppPrivateKey: "{{ .privateKey }}"
  data:
    - {secretKey: appID, remoteRef: {key: /ypm/prod/k3s/argocd/github_app_id}}
    - {secretKey: installationID, remoteRef: {key: /ypm/prod/k3s/argocd/github_app_installation_id}}
    - {secretKey: privateKey, remoteRef: {key: /ypm/prod/k3s/argocd/github_app_private_key}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: ssm}
  target:
    name: argocd-notifications-secret
  data:
    - {secretKey: github-appID, remoteRef: {key: /ypm/prod/k3s/argocd/github_app_id}}
    - {secretKey: github-installationID, remoteRef: {key: /ypm/prod/k3s/argocd/github_app_installation_id}}
    - {secretKey: github-privateKey, remoteRef: {key: /ypm/prod/k3s/argocd/github_app_private_key}}
