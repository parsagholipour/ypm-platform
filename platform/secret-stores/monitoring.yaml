apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: ssm}
  target:
    name: grafana-admin
    template:
      engineVersion: v2
      data:
        admin-user: admin
        admin-password: "{{ .password }}"
  data:
    - {secretKey: password, remoteRef: {key: /ypm/prod/env/grafana/GF_SECURITY_ADMIN_PASSWORD}}
