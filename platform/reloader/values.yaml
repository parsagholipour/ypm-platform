reloader:
  watchGlobally: true
  reloadOnCreate: false
  readOnlyRootFileSystem: true
  deployment:
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {memory: 128Mi}
