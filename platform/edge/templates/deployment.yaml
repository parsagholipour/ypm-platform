apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  labels:
    app.kubernetes.io/name: caddy
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: caddy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caddy
      annotations:
        # Roll the pods when the Caddyfile changes.
        checksum/caddyfile: {{ include "edge.caddyfile" . | sha256sum }}
    spec:
      priorityClassName: ypm-critical
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caddy
          image: {{ .Values.image }}
          args: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
            - {name: health, containerPort: 8081, protocol: TCP}
          readinessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 10
            failureThreshold: 6
          lifecycle:
            # Leave the Service's endpoints before Caddy stops accepting.
            preStop:
              exec:
                command: [sleep, "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              # The caddy binary carries this file capability; it must stay in
              # the bounding set for the binary to exec at all.
              add: [NET_BIND_SERVICE]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/caddy, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: state, mountPath: /config}
            - {name: data, mountPath: /data}
      volumes:
        - name: config
          configMap:
            name: caddy
        - {name: tmp, emptyDir: {}}
        - {name: state, emptyDir: {}}
        - {name: data, emptyDir: {}}
